<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speisekarte – JOLLOF Graz</title>
<meta name="robots" content="noindex">
<meta name="description" content="Die ganze Speisekarte von JOLLOF Graz mit Fotos und Preisen: Jollof Rice, Egusi, Okro, Pepper Soup, Pounded Yam, Fleisch, Fisch und Getränke.">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f5ec;--cream:#ebeedd;--ink:#16201a;--muted:#5d685c;--line:#dce2cf;--green:#3f8a2e;--green-d:#183018;--red:#c8322b;--gold:#e8a33a;
  --serif:'Syncopate',sans-serif;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#dfe5d3;color:var(--ink);font:400 15.5px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;background:var(--paper);min-height:100vh;padding-bottom:90px}
img{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}

.top{position:relative;height:170px;overflow:hidden;background:var(--green-d)}
.top img.bg{width:100%;height:100%;object-fit:cover;object-position:50% 55%}
.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,31,16,.15),rgba(15,31,16,.85))}
.top .bar{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;color:#fff}
.top .brand{display:flex;align-items:center;gap:10px}
.top .brand img{width:46px;height:46px;border-radius:10px}
.top h1{font:400 28px/1 var(--serif)}
.top small{display:block;font:600 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;opacity:.85;margin-top:6px}
.lang{display:flex;background:rgba(255,255,255,.18);border-radius:20px;padding:3px;backdrop-filter:blur(4px)}
.lang button{padding:5px 11px;border-radius:16px;font-weight:600;font-size:13px;color:#fff}
.lang button.on{background:#fff;color:var(--ink)}
.band{height:8px;background:repeating-linear-gradient(90deg,var(--gold) 0 40px,var(--red) 40px 50px,var(--green) 50px 90px,var(--paper) 90px 95px)}
.back:empty{display:none}.back{display:flow-root;padding:10px 16px;font-size:13.5px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}

.tabs{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:14px 8px 12px;font-weight:600;font-size:14.5px;color:var(--muted);border-bottom:2.5px solid transparent;text-decoration:none;white-space:nowrap}
.tabs a.on{color:var(--ink);border-color:var(--green)}

.zut{font-size:13px;color:#5d685c;margin:-4px 0 14px;line-height:1.45}.zut b{color:#16201a}
.hint{margin:14px 16px 0;padding:12px 14px;background:var(--cream);border-radius:8px;font-size:13.5px;color:#3d473c}
.hint b{color:var(--ink)}

h2.cat{font:400 22px var(--serif);padding:26px 16px 6px;scroll-margin-top:52px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.item:active{background:var(--cream)}
.item h3{font:600 16.5px/1.25 var(--sans)}
.item p{font-size:14px;color:var(--muted);margin:5px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .price{font-weight:700;font-size:15.5px;color:var(--red)}
.item .price small{font-weight:500;color:var(--muted);font-size:12.5px}
.item .ph{width:92px;height:92px;border-radius:8px;overflow:hidden;background:var(--cream)}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item .ph.kombi{width:120px;flex:none;display:flex;align-items:center;justify-content:center;gap:2px;background:#fff;border:1px solid #ececea;padding:4px}
.item .ph.kombi img{width:46%;height:auto;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 5px rgba(0,0,0,.15))}
.item .ph.kombi i,.sheet .hero.kombi i{flex:none;display:grid;place-items:center;border-radius:50%;background:#3f8a2e;color:#fff;font-style:normal;font-weight:800;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.item .ph.kombi i{width:20px;height:20px;font-size:13px}
.sheet .hero.kombi{background:#fff;display:flex;align-items:center;justify-content:center;gap:12px;padding:20px}
.sheet .hero.kombi img{max-width:40%;max-height:85%;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.16))}
.sheet .hero.kombi i{width:42px;height:42px;font-size:24px;border-width:3px}
.item.noimg{grid-template-columns:1fr}
.item .cnt{display:inline-block;margin-left:8px;background:var(--green);color:#fff;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;vertical-align:2px}

.review{margin:28px 16px 10px;padding:22px 20px;border-radius:10px;background:var(--green-d);color:#e6eedf}
.review .stars{color:var(--gold);font-size:20px;letter-spacing:2px}
.review h3{font:400 22px/1.2 var(--serif);color:#fff;margin:8px 0 6px}
.review p{font-size:14px;margin-bottom:16px;color:#cfdcc6}
.review a{display:flex;align-items:center;justify-content:center;height:48px;border-radius:6px;background:#fff;color:var(--ink);font-weight:700;text-decoration:none}
.legal{padding:18px 16px 40px;font-size:12px;color:var(--muted);line-height:1.6}

/* Merkliste */
.listbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;z-index:30;display:none;align-items:center;justify-content:space-between;
  background:var(--green);color:#fff;border-radius:10px;padding:0 18px;height:56px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.listbar.on{display:flex}

/* Detail */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,10,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:520px;transform:translate(-50%,100%);background:var(--paper);border-radius:16px 16px 0 0;z-index:41;transition:transform .25s;max-height:92vh;overflow:auto}
.open .sheet-bg{opacity:1;pointer-events:auto}
.open .sheet{transform:translate(-50%,0)}
.sheet .hero{height:280px;position:relative;background:var(--green-d)}
.sheet .hero img{width:100%;height:100%;object-fit:cover}
.sheet .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:20px;line-height:1}
.sheet .in{padding:20px 18px 26px;position:relative}
.sheet .in>.x{position:absolute;top:14px;right:14px;background:var(--cream)}
.sheet h2{font:400 26px/1.15 var(--serif);display:flex;justify-content:space-between;gap:12px;padding-right:4px}
.sheet h2 span{font:700 19px var(--sans);white-space:nowrap;padding-top:4px;color:var(--red)}
.sheet .what{margin:12px 0 16px;font-size:15px;color:#3a443a}
.pairs h4{font:600 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.pairs{margin-bottom:18px}
.item>div:first-child{min-width:0}
.prow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.prow::-webkit-scrollbar{display:none}
.pair{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border:1.5px dashed #c9d3b8;border-radius:10px;text-align:center}
.pair img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--cream)}
.pair div{font-weight:600;font-size:12px;line-height:1.2}
.pair em{font-style:normal;font-weight:700;font-size:11.5px;color:var(--red)}
.pair.on{border-style:solid;border-color:var(--green);background:#eef4e6}
.sheet .order{display:flex;align-items:center;justify-content:center;height:52px;border-radius:8px;background:var(--green);color:#fff;font-weight:700;font-size:16px;width:100%}
.sheet .sub{font-size:12.5px;color:var(--muted);text-align:center;margin-top:9px}
.lrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow button{color:var(--red);font-weight:700;padding:0 6px}
.ltotal{display:flex;justify-content:space-between;font:400 24px var(--serif);padding:16px 0}
h1,h2.cat,.sheet h2,.review h3{text-transform:uppercase;letter-spacing:-.02em}
.top h1{font-weight:700;font-size:24px}
h2.cat{font-size:19px}.sheet h2{font-size:20px;line-height:1.1}.review h3{font-size:18px}
</style>
</head>

function closeItem(){document.body.classList.remove('open')}
document.addEventListener('click',e=>{
  const it=e.target.closest('.item');if(it)return openItem(it.dataset.id);
